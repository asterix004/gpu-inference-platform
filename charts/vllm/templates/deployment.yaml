apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  # One GPU per node: the old pod must release the GPU before the new one can start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
    spec:
      # The Service is named "vllm", so service links would inject VLLM_PORT=tcp://...
      # which vLLM reads as its own port setting and refuses to start.
      enableServiceLinks: false
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --model={{ .Values.model }}
            - --served-model-name={{ .Values.servedModelName }}
            - --max-model-len={{ .Values.maxModelLen }}
            - --gpu-memory-utilization={{ .Values.gpuMemoryUtilization }}
            - --host=0.0.0.0
            - --port={{ .Values.service.port }}
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: HF_HOME
              value: /models
            {{- if .Values.hfTokenSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfTokenSecret }}
                  key: token
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          # Model download + weight load + CUDA graph capture can take several minutes.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: models
          emptyDir:
            sizeLimit: {{ .Values.modelCache.sizeLimit }}
        # PyTorch/NCCL use shared memory; the container default (64 MB) is too small.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
