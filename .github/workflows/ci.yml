name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [nebius, gke]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: infra/${{ matrix.module }}
      - run: terraform init -backend=false
        working-directory: infra/${{ matrix.module }}
      - run: terraform validate
        working-directory: infra/${{ matrix.module }}

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/vllm
      - run: helm template vllm charts/vllm > /dev/null

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff httpx==0.28.1
      - run: ruff check benchmark
      - run: python -m py_compile benchmark/bench.py benchmark/report.py

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck platform/install.sh
